<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastro - ADA Audiovisual</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="assets/Logo-Ada(topo).png" alt="Logo Ada Audiovisual" class="logo-img">
        </div>
    </header>

    <main class="register register-wrapper">
        <div class="register-card">
            <h2 class="register-title">Preencha com seus dados</h2>

            <form action="#" class="register-form" method="post">
                <div class="form-row">
                    <div class="input-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" placeholder="Digite seu nome" required autocomplete="off">
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required autocomplete="off">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" required autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="rede-social">Link da rede social</label>
                        <input type="url" id="rede-social" name="rede_social" autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="profissao">Profissão</label>
                        <input type="text" id="profissao" name="profissao" autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>

                    <div class="input-group">
                        <label for="repita-senha">Repita a senha</label>
                        <input type="password" id="repita-senha" name="repita_senha" required>
                    </div>
                    <button type="submit" class="btn-register">cadastrar</button>
            </form>
        </div>
    </main>

</body>

</html>
