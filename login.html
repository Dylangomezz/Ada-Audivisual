<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Audiovisual</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="navbar">
        <div class="logo-container">
            <img src="assets/Logo-Ada(topo).png" alt="Logo Ada Audiovisual" class="logo-img">
        </div>
    </header>

    <!-- Fomulario de login -->
    <main class="login-wrapper">
        <div class="login-card">
            <h2 class="welcome-title">Bem vindo/a!</h2>

            <form class="login-form">
                <div class="input-group">
                    <input type="text" placeholder="Login" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>

            <div class="login-links">
                <a href="#">Esqueceu sua senha? Recupere-a aqui</a>
                <a href="#">Primeiro acesso? Cadastre-se</a>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
     <footer class="footer"></footer>
</body>

</html>
